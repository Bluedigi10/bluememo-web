spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bluememo_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:app_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.com.bluedigi.bluememo=DEBUG
logging.level.org.hibernate.SQL=DEBUG